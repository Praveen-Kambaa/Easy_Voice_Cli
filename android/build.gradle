buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Notifee ships its Android AAR in node_modules — Gradle must resolve from this local repo.
allprojects {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    url("$rootDir/../node_modules/@notifee/react-native/android/libs")
                }
            }
            filter {
                includeGroup "app.notifee"
            }
        }
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
    }
}

// Skip library verify*Resources (AAPT2 can crash on Windows / AGP 8.12).
// Do not use afterEvaluate — Gradle 9 rejects it when the project is already evaluated.
subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        subproject.tasks.configureEach { task ->
            if (task.name.contains("verify") && task.name.contains("Resources")) {
                task.enabled = false
            }
        }
    }
}
