apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

repositories {
    google()
    mavenCentral()
}

// ── Auto-generate ApiConfig.kt from src/config/api.js ────────────────────────
// This keeps Android in sync with the JS API config — single source of truth.
task generateApiConfig {
    def jsApiFile   = rootProject.file("../src/config/api.js")
    def outDir      = file("src/main/java/com/typeeasy/generated")
    def outFile     = new File(outDir, "ApiConfig.kt")

    inputs.file jsApiFile
    outputs.file outFile

    doLast {
        def js = jsApiFile.text

        // Extract server URLs
        def typeEasy  = (js =~ /TYPE_EASY\s*:\s*['"]([^'"]+)['"]/)[0][1]
        def easyVoice = (js =~ /EASY_VOICE\s*:\s*['"]([^'"]+)['"]/)[0][1]

        // Extract top-level endpoints (TRANSLATE, GRAMMAR_CHECK)
        def translate    = (js =~ /TRANSLATE\s*:\s*['"]([^'"]+)['"]/)[0][1]
        def grammarCheck = (js =~ /GRAMMAR_CHECK\s*:\s*['"]([^'"]+)['"]/)[0][1]

        outDir.mkdirs()
        outFile.text = """\
package com.typeeasy.generated

/**
 * AUTO-GENERATED — do not edit manually.
 * Generated from src/config/api.js by the generateApiConfig Gradle task.
 * Re-runs automatically on every build whenever api.js changes.
 */
object ApiConfig {

    object Servers {
        const val TYPE_EASY  = "$typeEasy"
        const val EASY_VOICE = "$easyVoice"
    }

    object Endpoints {
        const val TRANSLATE     = "$translate"
        const val GRAMMAR_CHECK = "$grammarCheck"
    }

    fun typeEasyUrl(endpoint: String)  = "\${Servers.TYPE_EASY}\$endpoint"
    fun easyVoiceUrl(endpoint: String) = "\${Servers.EASY_VOICE}\$endpoint"
}
"""
        println "[generateApiConfig] Generated ApiConfig.kt from api.js"
        println "  TYPE_EASY  = $typeEasy"
        println "  EASY_VOICE = $easyVoice"
        println "  TRANSLATE  = $translate"
        println "  GRAMMAR_CHECK = $grammarCheck"
    }
}

// Wire the task to run before Kotlin compilation
tasks.whenTaskAdded { task ->
    if (task.name.startsWith("compile") && task.name.endsWith("Kotlin")) {
        task.dependsOn generateApiConfig
    }
}

// Add the generated sources directory to the Kotlin source set
android.sourceSets.main.java.srcDirs += ["src/main/java/com/typeeasy/generated"]
// ─────────────────────────────────────────────────────────────────────────────

repositories {
    google()
    mavenCentral()
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**x
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
// def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.typeeasy"
    defaultConfig { 
        applicationId "com.typeeasy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    
    // Fix JVM compatibility between Java and Kotlin (17)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn"
        ]
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            // minifyEnabled enableProguardInReleaseBuilds
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.0.0")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    // Floating overlay: on-device translation (internal translation toggle)
    implementation("com.google.mlkit:translate:17.0.3")

}
